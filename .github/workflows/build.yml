name: QUANTA verified builds
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quanta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QUANTA-browser-checks
          path: test-results/
          retention-days: 14
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - run: cargo test --locked --no-default-features
        working-directory: src-tauri
      - run: cargo clippy --locked --no-default-features -- -D warnings
        working-directory: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
  native:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: Windows-x64
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            name: Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: '${{ matrix.target }}'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          save-if: ${{ !cancelled() }}
      - run: npm ci
      - run: node scripts/package-plugins.mjs
      - run: node scripts/prepare-engine.mjs ${{ matrix.target }}
      - run: cargo test --locked --no-default-features
        working-directory: src-tauri
      - run: cargo check --locked --target ${{ matrix.target }}
        working-directory: src-tauri
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - run: node scripts/package-native.mjs ${{ matrix.target }}
      - run: node scripts/smoke-native.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: QUANTA-${{ matrix.name }}
          path: native-dist/
          if-no-files-found: error
          retention-days: 30
  release:
    needs: native
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: QUANTA-*
          path: installers
      - run: node scripts/prepare-release.mjs
      - name: Withdraw the initial preview with the pagination defect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-preview.4 --json tagName >/dev/null 2>&1; then
            gh release edit v0.1.0-preview.4 --draft
          fi
      - name: Publish verified preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v${version}-preview.${{ github.run_number }}" release-dist/* --target "${{ github.sha }}" --title "QUANTA ${version} · Preview ${{ github.run_number }}" --notes-file release-notes.md --prerelease
  web:
    needs: [native, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.web.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QUANTA-web-checks
          path: test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  pages:
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
